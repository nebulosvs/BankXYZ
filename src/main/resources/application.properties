spring.application.name=xyz

# Base de datos H2 (relacional embebida, modo PostgreSQL)
spring.datasource.url=jdbc:h2:file:./data/bankxyz;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=5

# Consola H2 para evidenciar resultados: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Inicializacion de esquema de negocio y metadatos de Spring Batch
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.batch.jdbc.initialize-schema=always

# No lanzar todos los jobs automaticamente: los ejecuta BatchJobsRunner
spring.batch.job.enabled=false

logging.level.com.banco.xyz=INFO
logging.level.org.springframework.batch=INFO
